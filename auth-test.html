<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>山居學習中心｜Google 登入測試</title><link rel="stylesheet" href="styles.css"><style>body{background:#f8f5f0;color:#432b2b;font-family:system-ui,sans-serif}.authwrap{max-width:680px;margin:8vh auto;padding:30px}.authcard{background:white;border:1px solid #e7ddd7;border-radius:18px;padding:32px;box-shadow:0 10px 40px #432b2b10}h1{font-size:26px}button{background:#873b40;color:white;border:0;border-radius:8px;padding:12px 20px;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#eee;color:#432b2b}.status{padding:14px;background:#f7f3ef;border-radius:8px;margin:16px 0;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#756767;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><main class="authwrap"><div class="authcard"><p class="muted">HILLSIDE LEARNING CENTER</p><h1>山居學習中心｜Google 登入測試</h1><p>這是獨立的串接測試頁，不會修改原本展示版的預約資料。</p><div id="status" class="status" role="status">正在確認登入狀態…</div><div class="actions"><button id="login" disabled>使用 Google 登入</button><button id="logout" class="secondary" hidden>登出</button><button id="refresh" class="secondary">重新檢查</button></div><p class="muted">測試階段：僅檢查登入與政大 Email，不會送出預約。正式權限仍須由 Supabase 後端強制檢查。</p><p><a href="index.html">返回原本的展示版網站</a></p></div></main><script type="module" src="auth-test.js"></script></body></html>
